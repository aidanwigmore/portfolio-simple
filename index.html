<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AidWig</title>
	<script src="https://kit.fontawesome.com/23b7b13b6b.js" crossorigin="anonymous"></script>	
	<script async src="//www.instagram.com/embed.js"></script>
	<style>
        body{
			display: flex;
			height: 100%;
			flex-direction: column; 
			justify-content: center;
		}
		.header {
			width:100%;
			justify-content: space-around;
			display: inline-flex;
			align-items: center;
		}
		.octagon {
			width: 50%;
			height: 100px;
			background-color: #e74c3c;
			clip-path: polygon(

			20% 0%, 
			80% 0%, 
			100% 100%, 
			0% 100%
				);
			}
		.hidden {
			display: none;
		}
		.rectangle {
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			width: 100%;
			background-color: #e74c3c;
			clip-path: square(5% 20% 15% 10%);
		}
		.inline {
			display: inline-block;
		}
		.lefttooltip {
			position: relative;
			display: inline-block;
			border-bottom: 1px dotted black;
			cursor: pointer;
		}

		.righttooltip {
			position: relative;
			display: inline-block;
			border-bottom: 1px dotted black;
			cursor: pointer;
		}

		.lefttooltiptext {
			visibility: hidden;
			width: 130px;
			top: -5px;
  			right: 105%;
			background-color: black;
			color: #ffffff;
			text-align: center;
			padding: 5px 0;
			border-radius: 6px;
			position: absolute;
			z-index: 1;
		}

		.righttooltiptext {
			visibility: hidden;
			width: 130px;
			top: -5px;
  			left: 105%;
			background-color: black;
			color: #ffffff;
			text-align: center;
			padding: 5px 0;
			border-radius: 6px;
			position: absolute;
			z-index: 1;
		}

		.lefttooltip:hover .lefttooltiptext {
			visibility: visible;
		}
		.righttooltip:hover .righttooltiptext {
			visibility: visible;
		}
		button {
			border-radius: 12px;
		}
		.gallery-row {
			display: grid;
			grid-template-columns: repeat(3, 1fr); /* 3 columns */
			gap: 1rem;
		}

		.gallery-column {
			width: 100%;
			object-fit: cover;
			display: block;
		}

		.fade-in {
			animation: fadeIn 1s ease-in-out;
		}

		@keyframes slideIn {
		from {
			transform: translateX(-100px);
			opacity: 0;
		}
		to {
			transform: translateX(0);
			opacity: 1;
		}
		}
    </style>
</head>
<body>
    <div class="header">
		<div class="righttooltip">

		<div class="lefttooltip"><button id="socialButton" type="button" class="icon">

		<script>
			const socialExpandState = { open: false };
			const pageListState = { open: false };

			function renderSocials() {
				const socialButton = document.getElementById('socialButton');
				const homeButton = document.getElementById('homeButton');
				const linkedInDiv = document.getElementById('linkedInDiv');
				const youtubeDiv = document.getElementById('youtubeDiv');
				const githubDiv = document.getElementById('githubDiv');
				const socialsLinkHint = document.getElementById('socialsLinkHint');
				const homeLinkHint = document.getElementById('righttooltiptext');
				
				socialsLinkHint.textContent = socialExpandState.open ? "Collapse Socials" : "Expand Socials";
				[linkedInDiv, youtubeDiv, githubDiv].forEach(div => {
					div.classList.toggle("hidden", !socialExpandState.open);
					div.classList.toggle("inline", socialExpandState.open);
				});
			}

			function renderPageList() {
				const projectsButton = document.getElementById('pageListButton');
				const projectsDiv = document.getElementById('projectsDiv');
				const youtubeDiv = document.getElementById('youtubeDiv');
				const televisionDiv = document.getElementById('televisionDiv');
				const pageListHint = document.getElementById('projectLinkHint');
				const photoGalleryDiv = document.getElementById('photoGalleryDiv');
				const videoGalleryDiv = document.getElementById('videoGalleryDiv');

				pageListHint.textContent = pageListState.open ? "Collapse Page List" : "Expand Page List";
				[projectsDiv, youtubeDiv, televisionDiv, photoGalleryDiv, videoGalleryDiv].forEach(div => {
					div.classList.toggle("hidden", !pageListState.open);
					div.classList.toggle("inline", pageListState.open);
				});
			}

			socialButton.addEventListener("click", () => {
				socialExpandState.open = !socialExpandState.open;
				if (socialExpandState.open) {
					socialButton.innerHTML = '<i class="fa-solid fa-xmark"></i>';
				} else {
					socialButton.innerHTML = '<i class="fa-solid fa-link"></i>';
				}
				renderSocials();
			});

			homeButton.addEventListener("click", () => {
				mainContentState.open = 0;
				renderContent();
			});

			pageListButton.addEventListener("click", () => {
				pageListState.open = !pageListState.open;
				if (pageListState.open) {
					pageListButton.innerHTML = '<i class="fa-solid fa-xmark"></i>';
				} else {
					pageListButton.innerHTML = '<i class="fa-solid fa-bars"></i>';
				}
				renderPageList();
			});

			renderSocials();
			renderPageList();
		</script>
