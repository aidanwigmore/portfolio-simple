<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://kit.fontawesome.com">
	<link rel="preconnect" href="https://www.instagram.com">
	<link rel="stylesheet" href="../styles.css">
	<link rel="stylesheet" href="../rainbow-glow.css">
	<link rel="stylesheet" href="../pixel-art-aidan.css">
	<link rel="stylesheet" href="../pixel-art-camera.css">
	<link rel="stylesheet" href="../pixel-art-hammer.css">
	<link rel="stylesheet" href="../pixel-art-bulb.css">
	<link rel="stylesheet" href="../pixel-art-github.css">
	<link rel="stylesheet" href="../pixel-art-linked-in.css">
	<link rel="stylesheet" href="../pixel-art-youtube.css">
	<link rel="stylesheet" href="../border-glow.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
	<script defer src="https://kit.fontawesome.com/23b7b13b6b.js" crossorigin="anonymous"></script>
	<script defer src="https://www.instagram.com/embed.js"></script>
</head>
<body>
    <div class="header">
		<button 
			id="homeButton" 
			type="button" 
			class="icon secondaryBackground primaryColor blackBorderRadius card"
		>
			<b class="primaryColor">AidWig</b>
		</button>
		<div class="octagon borderRadius"></div>
		
		<script>
			const socialExpandState = { open: false };
			const pageListState = { open: false };
			const homeButton = document.getElementById('homeButton');


			homeButton.addEventListener("click", () => {
				mainContentState.open = 0;
				renderContent();
			});

			document.addEventListener('keydown', (e) => {
				if (e.key === 'ArrowLeft') {
					console.log('Left arrow pressed');
					leftButtonClick();
				} else if (e.key === 'ArrowRight') {
					console.log('Right arrow pressed');
					rightButtonClick();
				}
			});

		</script>
	</div>
	<div class="rectangle borderRadius">
		<div>
			<button 
				id="leftButton" 
				type="button" 
				class="icon blackBorderRadius primaryColor secondaryBackground card"
			>
				<i class="fa-solid fa-angle-left primaryColor secondaryBackground"></i>	
			</button>
		</div>
		<div class="primaryBackground padding2 blackBorderRadius borderRadius" style="min-width: 50%;">
			<h1 
				id="mainContent" 
				style="text-align: center; font-weight: bold; text-decoration: underline; white-space: pre-line;"
				class="pixelify-sans"
			>
				welcome!
			</h1>
			<hr/>
			<p id="subContent" style="white-space: pre-line;"></p>
			<hr class="halfWidth"/>
			<div 
				id="subContentMainContent" 
				style="font-weight: normal;white-space: pre-line;"
			></div>
		</div>	
		<div>
			<button 
				id="rightButton" 
				type="button" 
				class="icon blackBorderRadius primaryColor secondaryBackground card"
			>
				<i class="fa-solid fa-angle-right primaryColor secondaryBackground"></i>	
			</button>
		</div>
		
	</div>
	<p class="primaryColor secondaryBackground primaryBorderRadius" style="padding: 5px;border-radius: 5px; text-align: center;">
		Aidan Wigmore's Portfolio Website
		2027 - AidWig.xyz
	</p>
	

	<script>
		const leftButton = document.getElementById('leftButton');
		const rightButton = document.getElementById('rightButton');
		
		const mainContent = document.getElementById('mainContent');
		const subContent = document.getElementById('subContent');
		const subContentMainContent = document.getElementById('subContentMainContent');
		
		const mainContentState = { open: 0 };
		const projectState = { open: 0 };

		async function loadPage(name) {
			const res = await fetch(`./pages/${name}.html`);
			document.getElementById('subContentMainContent').innerHTML = await res.text();
		}

		function renderContent() {
			switch(mainContentState.open) {
				case 0:
					mainContent.textContent = "Welcome!";
					subContent.textContent = "...to my home page.";
					loadPage('home');
					leftButton.textContent = "Gallery";
					rightButton.textContent = "Projects";
					break;
				case 1:
					mainContent.textContent = "Software Projects";
					subContent.textContent = "Here are some of the software projects I've worked on."
					loadPage('projects');
					leftButton.textContent = "Home";
					rightButton.textContent = "Work";
					break;
				case 2:
					mainContent.textContent = "Work Experience";
					subContent.textContent = "I've had a few different work experiences, and I'm grateful for each of them.";
					loadPage('work');
					leftButton.textContent = "Projects";
					rightButton.textContent = "Gallery";
					break;
				case 3:
					mainContent.textContent = "Gallery";
					subContent.textContent = "This page contains my contract and personal photography.\n\n";
					loadPage('photos');
					leftButton.textContent = "Work";
					rightButton.textContent = "Home";
					break;
			}
		}

		function rightButtonClick() {
			if ((mainContentState.open+1) < 4) {
				mainContentState.open++;
			} else{
				mainContentState.open = 0;
			}
			renderContent();
		}
		
		function leftButtonClick() {
			if ((mainContentState.open - 1) > -1) {
				mainContentState.open--;
			} else{
				mainContentState.open = 3;
			}
			
			renderContent();
		}
		
		document.getElementById('leftButton').addEventListener('click', () => {
			leftButtonClick();
		});
		
		document.getElementById('rightButton').addEventListener('click', () => {
			rightButtonClick();
		});

		renderContent();
	</script>
</body>
</html>
