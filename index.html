			const socialExpandState = { open: false };

			function renderSocials() {
				const socialButton = document.getElementById('socialIconButton');

				const linkedInDiv = document.getElementById('linkedInIconButtonDiv');
				const youtubeDiv = document.getElementById('youtubeIconButtonDiv');
				const githubDiv = document.getElementById('githubIconButtonDiv');
				const socialsLinkHint = document.getElementById('socialsLinkHint');
				const homeLinkHint = document.getElementById('righttooltiptext');
				
				socialsLinkHint.textContent = socialExpandState.open ? "Collapse Socials" : "Expand Socials";
				[linkedInDiv, youtubeDiv, githubDiv].forEach(div => {
					div.classList.toggle("hidden", !socialExpandState.open);
					div.classList.toggle("inline", socialExpandState.open);
				});
			}

			function renderPageList() {
				const projectsButton = document.getElementById('pageListButton');
				const projectsDiv = document.getElementById('projectsDiv');
				const youtubeDiv = document.getElementById('youtubeDiv');
				const televisionDiv = document.getElementById('televisionDiv');
				const pageListHint = document.getElementById('projectLinkHint');
				const photoGalleryDiv = document.getElementById('photoGalleryDiv');
				const videoGalleryDiv = document.getElementById('videoGalleryDiv');

				pageListHint.textContent = pageListState.open ? "Collapse Page List" : "Expand Page List";
				[projectsDiv, youtubeDiv, televisionDiv, photoGalleryDiv, videoGalleryDiv].forEach(div => {
					div.classList.toggle("hidden", !pageListState.open);
					div.classList.toggle("inline", pageListState.open);
				});
			}

			socialIconButton.addEventListener("click", () => {
				socialExpandState.open = !socialExpandState.open;
				if (socialExpandState.open) {
					socialIconButton.innerHTML = '<i class="fa-solid fa-xmark"></i>';
				} else {
					socialIconButton.innerHTML = '<i class="fa-solid fa-link"></i>';
				}
				renderSocials();
			});

			homeButton.addEventListener("click", () => {
				mainContentState.open = 0;
				renderContent();
			});

			pageListButton.addEventListener("click", () => {
				pageListState.open = !pageListState.open;
				if (pageListState.open) {
